<section class="header">
    <app-navbar></app-navbar>
    <img src="assets/images/isleno-xl-002.jpg" alt="principal-image" class="main-image">
    <app-busqueda></app-busqueda>
</section>
<main class="main">
    <section class="login-span">
        <a *ngIf="!isUserLoggedIn" routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">
            <img src="assets/images/cuenta.png" id="login-image" alt="Iniciar Sesión">
        </a>

        <button *ngIf="isUserLoggedIn" type="button" class="btn btn-secondary profile-popover-btn"
            data-bs-toggle="popover" data-bs-placement="right" data-bs-custom-class="custom-popover"
            [attr.data-bs-title]="'Hola, ' + (userName || 'Usuario')" [attr.data-bs-content]="getPopoverContent()"
            #profilePopoverBtn> <img src="assets/images/cuenta.png" id="login-image" alt="Mi Cuenta">
        </button>
    </section>
    <section class="inicial-text">
        <p>Descubre por qué nuestros hoteles son tú mejor opcion para tus proximas vacaciones.</p>
    </section>
    <p class="firma">- "Breaze In The Mooon"...</p>
</main>

<router-outlet></router-outlet>
