<section class="header">
    <app-navbar></app-navbar>
    <img src="assets/images/background3.jpg" alt="principal-image" class="main-image">
</section>
<main class="main">
    <section class="profile-container">
        <div class="profile-header">
            <h1>Mi Perfil</h1>
        </div>
    </section>
    <div class="form-container">
        <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="email">Digite su nuevo correo electronico:</label>
                <input type="text" id="email" name="email" formControlName="email" >
            </div>
            <div class="form-group">
                <label for="numberPhone">Digite su nuevo numero telefonico:</label>
                <input type="text" id="numerPhone" name="numerPhone" formControlName="numerPhone" >
            </div>
            <div class="form-group">
                <label for="password">Digite su nueva contraseña:</label>
                <input type="password" id="password" name="password" formControlName="password" >
            </div>
            <button type="submit" [disabled]="!profileForm.valid">Actualizar Datos</button>
        </form>

    </div>
</main>
