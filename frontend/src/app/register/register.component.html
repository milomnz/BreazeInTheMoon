<div class="login">
    <a routerLink="/StartPage"><h1 class="title">Breaze In The Moon</h1></a>
    <div class="login-container">
        <p>Bienvenido!</p>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="form-group"> 
                <label for="username">Nombre:</label>
                <input type="text" id="username" name="username" formControlName="username" required>
            </div>
            <div class="form-group">
                <label for="numberPhone">Numero de telefono:</label>
                <input type="text" id="numberPhone" name="numberPhone" formControlName="numberPhone" required>
            </div>
            <div class="form-group">
                <label for="email">Correo electronico:</label>
                <input type="text" id="email" name="email" formControlName="email" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" formControlName="password" required>
            </div>
            <div class="form-group">
                <label class="RedicterLogin">¿Ya tienes cuenta? <a routerLink="/login">Iniciar Sesión</a></label>
            </div>
            <button type="submit" [disabled]="!loginForm.valid">Registrarse</button>
        </form>
    </div>  
        
        <router-outlet></router-outlet>
</div>
